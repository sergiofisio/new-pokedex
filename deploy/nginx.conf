# Atrás do Cloudflare (SSL Full strict) com o certificado de origem em /etc/ssl/cloudflare.
# O IP real do visitante vem de /etc/nginx/conf.d/cloudflare-realip.conf.

server {
    listen 80;
    listen [::]:80;
    server_name tavernadosjogos.com.br www.tavernadosjogos.com.br;
    return 301 https://tavernadosjogos.com.br$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.tavernadosjogos.com.br;

    ssl_certificate /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    return 301 https://tavernadosjogos.com.br$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name tavernadosjogos.com.br;

    ssl_certificate /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }
}
