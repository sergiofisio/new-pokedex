name: Deploy VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.VPS_HOST != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configurar SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ vars.VPS_HOST }}
          PORT: ${{ vars.VPS_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$PORT" -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Publicar
        env:
          HOST: ${{ vars.VPS_HOST }}
          USER: ${{ vars.VPS_USER || 'root' }}
          PORT: ${{ vars.VPS_PORT || '22' }}
        run: ssh -p "$PORT" "$USER@$HOST" "bash -s -- $GITHUB_SHA" < deploy/deploy.sh
